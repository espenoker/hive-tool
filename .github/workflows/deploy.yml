name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/social-ad-format-generator-pfdBV  # remove after merging to main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore font files from secrets
        run: |
          echo "${{ secrets.FONT_APK_GALERIA_WOFF2 }}" | base64 --decode > static/fonts/APKGaleria-Regular.woff2
          echo "${{ secrets.FONT_APK_GALERIA_WOFF }}"  | base64 --decode > static/fonts/APKGaleria-Regular.woff

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deploy
