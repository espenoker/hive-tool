name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/social-ad-format-generator-pfdBV  # remove after merging to main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore font file from secret
        run: |
          echo "${{ secrets.FONT_APK_GALERIA_WOFF2 }}" | base64 --decode > static/fonts/APKGaleria-Regular.woff2

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
